name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Production runs on Postgres. SQLite is what contributors run locally.
        # Both, because each has caught bugs the other let through.
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
          POSTGRES_DB: research_coach
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coach" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://coach:coach@localhost:5432/research_coach' || 'sqlite:///./research_coach.db' }}
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: Browser checks
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r backend/requirements.txt
      - run: npm ci --prefix frontend
      - run: npm ci --prefix e2e && npx --prefix e2e playwright install --with-deps chromium
      - name: Start API and frontend
        run: |
          (cd backend && uvicorn app.main:app --port 8000 > ../api.log 2>&1 &)
          (cd frontend && npx vite --port 5173 --strictPort > ../vite.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:5173/api/health && break; sleep 1; done
      - run: npm run smoke --prefix e2e
      - run: npm run flows --prefix e2e
      - name: Server log
        if: failure()
        run: tail -n 200 api.log
